name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ESLINT_VERSION: "10.13.0"

jobs:
  python:
    name: Server and evaluation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install analysers and dependencies
        run: |
          pip install -r requirements-dev.txt
          npm install -g eslint@${ESLINT_VERSION}
          semgrep --version && bandit --version && ruff --version && eslint --version
      - name: Server tests (includes the tests that run the real analysers)
        working-directory: server
        run: python -m pytest -q -rs
      - name: Evaluation tests
        working-directory: evaluation
        run: python -m pytest -q
      - name: Generated dataset files match dataset/src
        working-directory: evaluation
        run: python build_dataset.py --check

  client:
    name: Client type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vite build

  docker:
    name: Image smoke test (no API key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t code-review --build-arg ESLINT_VERSION=${ESLINT_VERSION} .
      - run: scripts/smoke_test.sh code-review
